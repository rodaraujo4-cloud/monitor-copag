name: Monitor Copag

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (troque 10 por 30 para meia em meia hora)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: monitor-copag
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Verificar produtos
        env:
          COPAG_EMAIL: ${{ secrets.COPAG_EMAIL }}
          COPAG_SENHA: ${{ secrets.COPAG_SENHA }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_copag.py

      - name: Guardar resultado para a próxima verificação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || (git commit -m "Atualiza estado do monitor" && git pull --rebase && git push)
